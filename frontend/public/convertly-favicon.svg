<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#080620"/>

  <!-- Broken orbit ring — gaps suggest the 5 systems orbiting -->
  <!-- Full circle stroked with dasharray to create a broken orbit -->
  <circle cx="50" cy="50" r="30"
    fill="none"
    stroke="#22D3EE"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="14 5.4"
    stroke-dashoffset="0"
    opacity="0.55"/>

  <!-- Glow halo behind dot -->
  <circle cx="50" cy="50" r="9"
    fill="url(#dotGlow)"
    opacity="0.35"/>

  <!-- Core dot -->
  <circle cx="50" cy="50" r="5.5"
    fill="#22D3EE"
    filter="url(#softGlow)"/>

  <!-- Crisp inner dot -->
  <circle cx="50" cy="50" r="3.5"
    fill="#F8FAFC"/>
</svg>
